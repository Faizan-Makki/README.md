<svg width="1200" height="480" viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="parchment" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14120f"/>
      <stop offset="100%" stop-color="#0a0908"/>
    </linearGradient>
    <filter id="mapGlow"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>
  <rect width="1200" height="480" fill="url(#parchment)"/>
  <rect x="10" y="10" width="1180" height="460" fill="none" stroke="#c9a35d" stroke-width="1" opacity="0.4"/>

  <!-- faint terrain texture lines -->
  <g stroke="#c9a35d" stroke-width="0.4" opacity="0.15" fill="none">
    <path d="M30,120 Q300,60 600,120 T1170,110"/>
    <path d="M30,240 Q300,300 600,240 T1170,260"/>
    <path d="M30,380 Q300,340 600,390 T1170,370"/>
  </g>

  <!-- trade route lines connecting the seven territories -->
  <g stroke="#c9a35d" stroke-width="1" stroke-dasharray="4 4" opacity="0.55" fill="none">
    <path d="M170,110 L360,180 L560,110 L760,190 L950,120 L1050,240 L820,320 L560,260 L340,330 L170,240 Z"/>
  </g>

  <!-- seven territory nodes -->
  <g font-family="Georgia, serif" font-size="13" fill="#e8dcc0" text-anchor="middle">
    <circle cx="170" cy="110" r="7" fill="#4a6fa5" filter="url(#mapGlow)"/>
    <text x="170" y="90">THE VALE</text>
    <text x="170" y="140" font-size="10" fill="#9aa0bd">SQL</text>

    <circle cx="360" cy="180" r="7" fill="#c9a35d" filter="url(#mapGlow)"/>
    <text x="360" y="160">THE RIVERLANDS</text>
    <text x="360" y="205" font-size="10" fill="#9aa0bd">Data Wrangling</text>

    <circle cx="560" cy="110" r="7" fill="#7a1f2b" filter="url(#mapGlow)"/>
    <text x="560" y="90">THE REACH</text>
    <text x="560" y="140" font-size="10" fill="#9aa0bd">Analytics</text>

    <circle cx="760" cy="190" r="7" fill="#4a6fa5" filter="url(#mapGlow)"/>
    <text x="760" y="170">THE WESTERLANDS</text>
    <text x="760" y="215" font-size="10" fill="#9aa0bd">Predictive Models</text>

    <circle cx="950" cy="120" r="7" fill="#c9a35d" filter="url(#mapGlow)"/>
    <text x="950" y="100">OLD VALYRIA</text>
    <text x="950" y="150" font-size="10" fill="#9aa0bd">Generative AI</text>

    <circle cx="1050" cy="240" r="7" fill="#7a1f2b" filter="url(#mapGlow)"/>
    <text x="1030" y="270" font-size="12">THE CITADEL</text>
    <text x="1030" y="290" font-size="10" fill="#9aa0bd">Deep Learning</text>

    <circle cx="600" cy="300" r="8" fill="#e8c887" filter="url(#mapGlow)">
      <animate attributeName="r" values="7;10;7" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="600" y="330" font-size="13" fill="#e8c887">THE KING'S ROAD</text>
    <text x="600" y="350" font-size="10" fill="#9aa0bd">Deployment · Delivery</text>
  </g>

  <text x="600" y="440" text-anchor="middle" font-family="Georgia, serif" letter-spacing="5" font-size="13" fill="#8f96b8">A MAP OF TERRITORIES STUDIED AND HELD</text>
</svg>
