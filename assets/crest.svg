<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="crestBg" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#161829"/>
      <stop offset="100%" stop-color="#05060a"/>
    </radialGradient>
    <linearGradient id="crestGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8c887"/>
      <stop offset="100%" stop-color="#a9843f"/>
    </linearGradient>
  </defs>

  <circle cx="110" cy="110" r="104" fill="url(#crestBg)" stroke="url(#crestGold)" stroke-width="2"/>
  <circle cx="110" cy="110" r="94" fill="none" stroke="#c9a35d" stroke-width="1" stroke-dasharray="2 4" opacity="0.6">
    <animateTransform attributeName="transform" type="rotate" values="0 110 110;360 110 110" dur="60s" repeatCount="indefinite"/>
  </circle>

  <!-- small crown -->
  <g fill="url(#crestGold)">
    <polygon points="90,46 96,60 104,44 110,60 116,44 124,60 130,46 130,54 90,54"/>
    <circle cx="104" cy="44" r="2"/>
    <circle cx="116" cy="44" r="2"/>
    <circle cx="110" cy="40" r="2.4"/>
  </g>

  <!-- raven body fused with circuit nodes -->
  <g stroke="url(#crestGold)" stroke-width="1.4" fill="none" opacity="0.9">
    <line x1="110" y1="150" x2="80" y2="128"/>
    <line x1="110" y1="150" x2="140" y2="128"/>
    <line x1="110" y1="150" x2="70" y2="150"/>
    <line x1="110" y1="150" x2="150" y2="150"/>
    <line x1="110" y1="150" x2="110" y2="180"/>
  </g>
  <g fill="url(#crestGold)">
    <circle cx="80" cy="128" r="3"/>
    <circle cx="140" cy="128" r="3"/>
    <circle cx="70" cy="150" r="3"/>
    <circle cx="150" cy="150" r="3"/>
    <circle cx="110" cy="180" r="3"/>
  </g>

  <path d="M110,70 C95,70 84,82 82,98 C81,106 84,113 90,118 L84,124 C90,126 96,124 100,120 C103,124 108,126 112,124 C116,126 121,124 124,120 C128,124 134,126 140,124 L134,118 C140,113 143,106 142,98 C140,82 129,70 114,70 Z"
        fill="#050608" stroke="url(#crestGold)" stroke-width="1.6"/>
  <circle cx="103" cy="90" r="2.2" fill="url(#crestGold)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <path d="M96,96 L86,90" stroke="url(#crestGold)" stroke-width="1.4"/>

  <text x="110" y="205" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#c9a35d">F · AHMED</text>
</svg>
