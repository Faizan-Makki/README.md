<svg width="1200" height="450" viewBox="0 0 1200 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#05060a"/>
      <stop offset="45%" stop-color="#12142b"/>
      <stop offset="100%" stop-color="#05060a"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f4ecd8" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#c9a35d" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c9a35d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mistGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a35d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8a93b8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#c9a35d" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c887"/>
      <stop offset="50%" stop-color="#c9a35d"/>
      <stop offset="100%" stop-color="#e8c887"/>
    </linearGradient>
    <filter id="softBlur"><feGaussianBlur stdDeviation="2.2"/></filter>
    <filter id="bigBlur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="450" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#e8dcc0">
    <circle cx="80" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="180" cy="110" r="1"><animate attributeName="opacity" values="0.8;0.1;0.8" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="45" r="1.6"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="90" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="470" cy="55" r="1.3"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1"><animate attributeName="opacity" values="0.6;0.1;0.6" dur="3.3s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="50" r="1.2"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="830" cy="120" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1060" cy="140" r="1"><animate attributeName="opacity" values="0.7;0.1;0.7" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="60" r="1.3"><animate attributeName="opacity" values="0.3;0.9;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- moon -->
  <circle cx="1000" cy="95" r="90" fill="url(#moonGlow)"/>
  <circle cx="1000" cy="95" r="34" fill="#efe3c8">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- far mountains -->
  <path d="M0,300 L120,250 L220,290 L340,230 L460,300 L600,240 L760,300 L900,250 L1050,295 L1200,255 L1200,340 L0,340 Z" fill="#0a0c18" opacity="0.85"/>
  <!-- near mountains -->
  <path d="M0,340 L150,290 L300,330 L470,270 L640,330 L820,280 L1000,335 L1200,300 L1200,400 L0,400 Z" fill="#05060c"/>

  <!-- castle silhouette -->
  <g fill="#04050a">
    <rect x="540" y="255" width="14" height="70"/>
    <rect x="533" y="245" width="28" height="12"/>
    <rect x="580" y="230" width="18" height="95"/>
    <rect x="571" y="218" width="36" height="14"/>
    <rect x="620" y="260" width="14" height="65"/>
    <rect x="613" y="250" width="28" height="12"/>
    <rect x="560" y="300" width="80" height="25"/>
    <polygon points="595,190 595,220 605,220 605,190 600,178"/>
  </g>
  <rect x="587" y="200" width="6" height="10" fill="#c9a35d" opacity="0.7">
    <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2.4s" repeatCount="indefinite"/>
  </rect>

  <!-- raven flying across -->
  <g fill="#020204">
    <path id="ravenShape" d="M0,0 C-8,-3 -16,0 -20,4 C-14,3 -9,3 -6,5 C-9,7 -13,9 -16,13 C-9,10 -3,9 0,10 C3,9 9,10 16,13 C13,9 9,7 6,5 C9,3 14,3 20,4 C16,0 8,-3 0,0 Z"/>
    <animateMotion path="M -50,120 C 250,40 550,160 900,60 C 1000,30 1100,50 1260,80" dur="14s" repeatCount="indefinite"/>
  </g>

  <!-- drifting mist -->
  <rect x="-200" y="320" width="600" height="60" fill="url(#mistGrad)" filter="url(#bigBlur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; 900,0; 0,0" dur="22s" repeatCount="indefinite"/>
  </rect>
  <rect x="700" y="360" width="600" height="50" fill="url(#mistGrad)" filter="url(#bigBlur)">
    <animateTransform attributeName="transform" type="translate" values="0,0; -900,0; 0,0" dur="26s" repeatCount="indefinite"/>
  </rect>

  <!-- floating embers/particles -->
  <g fill="#c9a35d">
    <circle cx="200" cy="400" r="1.6" opacity="0.7"><animate attributeName="cy" values="400;150;400" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="410" r="1.4" opacity="0.6"><animate attributeName="cy" values="410;180;410" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="11s" repeatCount="indefinite"/></circle>
    <circle cx="760" cy="405" r="1.6" opacity="0.7"><animate attributeName="cy" values="405;160;405" dur="10s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="10s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="400" r="1.3" opacity="0.5"><animate attributeName="cy" values="400;200;400" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- ornamental gold frame -->
  <rect x="14" y="14" width="1172" height="422" fill="none" stroke="#c9a35d" stroke-width="1" opacity="0.45"/>
  <g stroke="#c9a35d" stroke-width="1.3" fill="none" opacity="0.7">
    <path d="M14,44 L14,14 L44,14"/>
    <path d="M1156,14 L1186,14 L1186,44"/>
    <path d="M1186,406 L1186,436 L1156,436"/>
    <path d="M44,436 L14,436 L14,406"/>
  </g>

  <!-- titles -->
  <text x="600" y="145" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" letter-spacing="8" fill="#8f96b8">THE ROYAL ARCHIVES</text>
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" letter-spacing="4" fill="url(#goldText)" filter="url(#softBlur)">FAIZAN AHMED</text>
  <text x="600" y="222" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="bold" letter-spacing="4" fill="url(#goldText)">FAIZAN AHMED</text>
  <text x="600" y="262" text-anchor="middle" font-family="Georgia, serif" font-size="16" letter-spacing="6" fill="#c9a35d" opacity="0.9">DATA · AI · INTELLIGENCE</text>
  <text x="600" y="305" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="14" fill="#9aa0bd">"The realm runs on information."</text>
</svg>
