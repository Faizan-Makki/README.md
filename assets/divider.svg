<svg width="900" height="30" viewBox="0 0 900 30" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="divGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a35d" stop-opacity="0"/>
      <stop offset="50%" stop-color="#c9a35d" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c9a35d" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="15" x2="900" y2="15" stroke="url(#divGrad)" stroke-width="1.2"/>
  <g transform="translate(450,15)">
    <rect x="-6" y="-6" width="12" height="12" fill="#0d1117" stroke="#c9a35d" stroke-width="1.2" transform="rotate(45)"/>
    <circle r="2" fill="#c9a35d">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
